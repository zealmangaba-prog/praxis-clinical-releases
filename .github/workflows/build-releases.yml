name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: Praxis_Clinical_macOS.dmg
          - os: windows-latest
            artifact_name: dist/Praxis_Clinical.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywin32

      # --- macOS Build Step ---
      - name: Build macOS App & DMG
        if: runner.os == 'macOS'
        run: |
          pyinstaller --clean --noconfirm --onedir --windowed \
            --name "Praxis Clinical" \
            --add-data "core:core" \
            --collect-all streamlit \
            app.py
          hdiutil create -volname "Praxis Clinical" -srcfolder "dist/Praxis Clinical.app" -ov -format UDZO "Praxis_Clinical_macOS.dmg"

      # --- Windows Build Step (Runs in cmd to ignore stderr warnings) ---
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name "Praxis_Clinical" --add-data "core;core" --collect-all streamlit app.py

      # --- Upload Assets to Release ---
      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}