name: Build and Release Binaries

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Standalone Executable
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name "PraxisClinical" --add-data "core;core" --add-data "public_key.pem;." --add-data "app.py;." --copy-metadata streamlit --copy-metadata cryptography --copy-metadata docx --copy-metadata reportlab main.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PraxisClinical-Windows
          path: dist/PraxisClinical.exe
